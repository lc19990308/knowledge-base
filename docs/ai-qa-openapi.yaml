    AssistantView: {type: object, required: [assistantId, name, bindings, enabled], properties: {assistantId: {$ref: '#/components/schemas/Id'}, name: {type: string}, bindings: {type: array, items: {$ref: '#/components/schemas/AssistantBindingView'}}, enabled: {type: boolean, description: 管理员列表包含已停用助手，据此显示状态。}}}
