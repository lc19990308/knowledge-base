    UserSpaceMembership: {type: object, required: [spaceId, canRead, canMaintain], additionalProperties: false, properties: {spaceId: {$ref: '#/components/schemas/Id'}, canRead: {type: boolean}, canMaintain: {type: boolean}}}
    SpaceMembershipsInput: {type: object, required: [memberships], additionalProperties: false, properties: {memberships: {type: array, items: {$ref: '#/components/schemas/UserSpaceMembership'}}}}
    UserSpaceMembershipPage: {type: object, required: [items, nextCursor, total], properties: {items: {type: array, items: {$ref: '#/components/schemas/UserSpace'}}, nextCursor: {$ref: '#/components/schemas/NextCursor'}, total: {$ref: '#/components/schemas/Count'}}}
    AssistantBinding: {type: object, required: [spaceId, role], additionalProperties: false, properties: {spaceId: {$ref: '#/components/schemas/Id'}, role: {type: string, const: RETRIEVAL, description: 检索来源角色，不授予用户权限。}}}
    AssistantBindingView: {type: object, required: [spaceId, role, spaceName], properties: {spaceId: {$ref: '#/components/schemas/Id'}, role: {type: string, const: RETRIEVAL, description: 检索来源角色，不授予用户权限。}, spaceName: {type: string, description: 空间名称，只读回填；绑定接口不接受该字段。}}}
