    MaskedParagraph: {type: object, additionalProperties: false, required: [id, status, code], properties: {id: {$ref: '#/components/schemas/Id'}, status: {type: string, const: MASKED}, code: {type: string, const: SOURCE_UNAVAILABLE}}}
